    <svg viewBox="0 0 128 128" width="56" height="56"><circle cx="28" cy="38" r="14" fill="#E5484D"/><circle cx="28" cy="90" r="14" fill="#E5484D"/><circle cx="100" cy="64" r="16" fill="#58E3A8"/><path d="M42 38 C70 38 75 56 86 62 M42 90 C70 90 75 72 86 66" stroke="#FFF" stroke-width="4" fill="none"/></svg>
