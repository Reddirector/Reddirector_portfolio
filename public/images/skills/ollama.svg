    </pattern>
  </defs>

  <!-- Background -->
  <rect width="440" height="260" rx="16" fill="url(#bg-ollama)" />
  <rect width="440" height="260" rx="16" fill="url(#grid-ollama)" />
  <rect width="440" height="260" rx="16" fill="url(#glow-ollama)" />
  <rect width="438" height="258" x="1" y="1" rx="15" fill="none" stroke="url(#border-ollama)" stroke-width="1.5" />

  <!-- Category Tag -->
  <rect x="28" y="24" width="130" height="22" rx="4" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="38" y="39" fill="#A3A3A3" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" letter-spacing="1">EDGE & LOCAL AI</text>

  <!-- Icon Graphic -->
  <g transform="translate(348, 24)">
    <svg viewBox="0 0 128 128" width="56" height="56"><circle cx="64" cy="64" r="48" fill="#171717" stroke="#FFF" stroke-width="5"/><circle cx="48" cy="54" r="6" fill="#FFF"/><circle cx="80" cy="54" r="6" fill="#FFF"/><ellipse cx="64" cy="74" rx="14" ry="8" fill="#FFF"/></svg>
  </g>

  <!-- Title -->
