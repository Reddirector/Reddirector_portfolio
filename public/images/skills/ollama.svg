<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" width="440" height="260">
  <defs>
    <linearGradient id="bg-ollama" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140E10" />
      <stop offset="100%" stop-color="#080607" />
    </linearGradient>
    <radialGradient id="glow-ollama" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="border-ollama" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#A3A3A3" stop-opacity="0.35" />
    </linearGradient>
    <pattern id="grid-ollama" width="24" height="24" patternUnits="userSpaceOnUse">
