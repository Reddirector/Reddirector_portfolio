<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" width="440" height="260">
  <defs>
    <linearGradient id="bg-timeouts" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140E10" />
      <stop offset="100%" stop-color="#080607" />
    </linearGradient>
    <radialGradient id="glow-timeouts" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#E5484D" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#E5484D" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="border-timeouts" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E5484D" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#F04438" stop-opacity="0.35" />
    </linearGradient>
    <pattern id="grid-timeouts" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="440" height="260" rx="16" fill="url(#bg-timeouts)" />
  <rect width="440" height="260" rx="16" fill="url(#grid-timeouts)" />
  <rect width="440" height="260" rx="16" fill="url(#glow-timeouts)" />
  <rect width="438" height="258" x="1" y="1" rx="15" fill="none" stroke="url(#border-timeouts)" stroke-width="1.5" />

  <!-- Category Tag -->
  <rect x="28" y="24" width="130" height="22" rx="4" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="38" y="39" fill="#F04438" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" letter-spacing="1">PROCESS ISOLATION</text>

  <!-- Icon Graphic -->
  <g transform="translate(348, 24)">
    <svg viewBox="0 0 128 128" width="56" height="56"><circle cx="64" cy="64" r="48" stroke="#E5484D" stroke-width="6" fill="none"/><line x1="64" y1="32" x2="64" y2="64" stroke="#FFF" stroke-width="6" stroke-linecap="round"/><line x1="64" y1="64" x2="88" y2="64" stroke="#FFF" stroke-width="6" stroke-linecap="round"/><circle cx="64" cy="64" r="6" fill="#E5484D"/></svg>
  </g>

  <!-- Title -->
  <text x="28" y="92" fill="#F5F5F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5">POSIX SIGKILL Timeouts</text>

  <!-- Accent line -->
  <rect x="28" y="112" width="48" height="2.5" rx="1" fill="#E5484D" />

  <!-- Description -->
  <foreignObject x="28" y="126" width="384" height="96">
    <div xmlns="http://www.w3.org/1999/xhtml" style="color: rgba(255,255,255,0.72); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13.5px; line-height: 1.55; margin: 0; padding: 0;">
      Enforcing hard timeouts via child process process-group SIGKILL termination, eliminating thread-stall zombie leaks.
    </div>
