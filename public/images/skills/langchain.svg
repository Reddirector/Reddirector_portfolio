<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" width="440" height="260">
  <defs>
    <linearGradient id="bg-langchain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140E10" />
      <stop offset="100%" stop-color="#080607" />
    </linearGradient>
    <radialGradient id="glow-langchain" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00A67E" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#00A67E" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="border-langchain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00A67E" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#2FE4AB" stop-opacity="0.35" />
    </linearGradient>
    <pattern id="grid-langchain" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="440" height="260" rx="16" fill="url(#bg-langchain)" />
  <rect width="440" height="260" rx="16" fill="url(#grid-langchain)" />
  <rect width="440" height="260" rx="16" fill="url(#glow-langchain)" />
  <rect width="438" height="258" x="1" y="1" rx="15" fill="none" stroke="url(#border-langchain)" stroke-width="1.5" />

  <!-- Category Tag -->
  <rect x="28" y="24" width="130" height="22" rx="4" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="38" y="39" fill="#2FE4AB" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" letter-spacing="1">LLM ORCHESTRATION</text>

  <!-- Icon Graphic -->
  <g transform="translate(348, 24)">
    <svg viewBox="0 0 128 128" width="56" height="56"><circle cx="42" cy="64" r="22" fill="none" stroke="#00A67E" stroke-width="8"/><circle cx="86" cy="64" r="22" fill="none" stroke="#2FE4AB" stroke-width="8"/></svg>
  </g>

  <!-- Title -->
  <text x="28" y="92" fill="#F5F5F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5">LangChain & LangSmith</text>

  <!-- Accent line -->
  <rect x="28" y="112" width="48" height="2.5" rx="1" fill="#00A67E" />

  <!-- Description -->
  <foreignObject x="28" y="126" width="384" height="96">
    <div xmlns="http://www.w3.org/1999/xhtml" style="color: rgba(255,255,255,0.72); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13.5px; line-height: 1.55; margin: 0; padding: 0;">
      Chaining prompt templates, tool integration, telemetry logging, token tracking, and execution tracing.
    </div>
  </foreignObject>

  <!-- Verification Pill -->
  <g transform="translate(28, 218)">
    <circle cx="5" cy="5" r="3.5" fill="#2FE4AB" />
    <text x="16" y="8.5" fill="rgba(255,255,255,0.5)" font-family="ui-monospace, monospace" font-size="10" letter-spacing="0.5">SHIPPED · APPLIED IN PROJECTS</text>
  </g>
</svg>