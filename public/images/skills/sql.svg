    <svg viewBox="0 0 128 128" width="56" height="56"><path fill="#336791" d="M64 12C33.1 12 8 20.1 8 30v68c0 9.9 25.1 18 56 18s56-8.1 56-18V30c0-9.9-25.1-18-56-18zm0 10c26.5 0 46 6.3 46 8s-19.5 8-46 8-46-6.3-46-8 19.5-8 46-8zm46 28c0 1.7-19.5 8-46 8s-46-6.3-46-8V43.5c10.8 4.7 27.4 7.5 46 7.5s35.2-2.8 46-7.5V50zm0 24c0 1.7-19.5 8-46 8s-46-6.3-46-8V67.5c10.8 4.7 27.4 7.5 46 7.5s35.2-2.8 46-7.5V74zm0 24c0 1.7-19.5 8-46 8s-46-6.3-46-8V91.5c10.8 4.7 27.4 7.5 46 7.5s35.2-2.8 46-7.5V98z"/></svg>
