<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" width="440" height="260">
  <defs>
    <linearGradient id="bg-git" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140E10" />
      <stop offset="100%" stop-color="#080607" />
    </linearGradient>
    <radialGradient id="glow-git" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#F05032" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#F05032" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="border-git" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F05032" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FA7A60" stop-opacity="0.35" />
    </linearGradient>
    <pattern id="grid-git" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="440" height="260" rx="16" fill="url(#bg-git)" />
  <rect width="440" height="260" rx="16" fill="url(#grid-git)" />
  <rect width="440" height="260" rx="16" fill="url(#glow-git)" />
  <rect width="438" height="258" x="1" y="1" rx="15" fill="none" stroke="url(#border-git)" stroke-width="1.5" />

  <!-- Category Tag -->
  <rect x="28" y="24" width="130" height="22" rx="4" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="38" y="39" fill="#FA7A60" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" letter-spacing="1">VERSION CONTROL</text>

  <!-- Icon Graphic -->
  <g transform="translate(348, 24)">
    <svg viewBox="0 0 128 128" width="56" height="56"><path fill="#F05032" d="M125.6 57.6L70.4 2.4c-3.2-3.2-8.3-3.2-11.5 0L42.5 18.8l14.7 14.7c3.4-1.1 7.4-.3 10.1 2.4 2.7 2.7 3.5 6.7 2.4 10.1l14.1 14.1c3.4-1.1 7.4-.3 10.1 2.4 3.8 3.8 3.8 10 0 13.8-3.8 3.8-10 3.8-13.8 0-2.9-2.9-3.7-7.2-2.2-10.7L67.1 52v33.4c.9.5 1.7 1.2 2.4 1.9 3.8 3.8 3.8 10 0 13.8-3.8 3.8-10 3.8-13.8 0-3.8-3.8-3.8-10 0-13.8.9-.9 1.9-1.6 3-2.1V51.7c-1.1-.5-2.1-1.2-3-2.1-2.9-2.9-3.7-7.3-2.2-10.8L38.9 24.2 2.4 60.7c-3.2 3.2-3.2 8.3 0 11.5l55.2 55.2c3.2 3.2 8.3 3.2 11.5 0l56.5-56.5c3.2-3.2 3.2-8.3 0-11.5v-1.8z"/></svg>
  </g>

  <!-- Title -->
  <text x="28" y="92" fill="#F5F5F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5">Git & GitHub</text>

  <!-- Accent line -->
  <rect x="28" y="112" width="48" height="2.5" rx="1" fill="#F05032" />

  <!-- Description -->
  <foreignObject x="28" y="126" width="384" height="96">
    <div xmlns="http://www.w3.org/1999/xhtml" style="color: rgba(255,255,255,0.72); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13.5px; line-height: 1.55; margin: 0; padding: 0;">
      Trunk-based development, branch isolation, clean atomic commit histories, CI/CD, and release packaging.
    </div>
  </foreignObject>

  <!-- Verification Pill -->
  <g transform="translate(28, 218)">
    <circle cx="5" cy="5" r="3.5" fill="#FA7A60" />
    <text x="16" y="8.5" fill="rgba(255,255,255,0.5)" font-family="ui-monospace, monospace" font-size="10" letter-spacing="0.5">SHIPPED · APPLIED IN PROJECTS</text>
  </g>
</svg>