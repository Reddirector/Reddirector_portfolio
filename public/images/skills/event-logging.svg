<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" width="440" height="260">
  <defs>
    <linearGradient id="bg-event-logging" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140E10" />
      <stop offset="100%" stop-color="#080607" />
    </linearGradient>
    <radialGradient id="glow-event-logging" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#E5484D" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#E5484D" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="border-event-logging" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E5484D" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#58E3A8" stop-opacity="0.35" />
    </linearGradient>
    <pattern id="grid-event-logging" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="440" height="260" rx="16" fill="url(#bg-event-logging)" />
  <rect width="440" height="260" rx="16" fill="url(#grid-event-logging)" />
  <rect width="440" height="260" rx="16" fill="url(#glow-event-logging)" />
  <rect width="438" height="258" x="1" y="1" rx="15" fill="none" stroke="url(#border-event-logging)" stroke-width="1.5" />

  <!-- Category Tag -->
  <rect x="28" y="24" width="130" height="22" rx="4" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="38" y="39" fill="#58E3A8" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" letter-spacing="1">DURABLE STORAGE</text>

  <!-- Icon Graphic -->
  <g transform="translate(348, 24)">
    <svg viewBox="0 0 128 128" width="56" height="56"><rect x="24" y="16" width="80" height="96" rx="8" fill="#1C1819" stroke="#E5484D" stroke-width="4"/><line x1="38" y1="38" x2="90" y2="38" stroke="#58E3A8" stroke-width="4"/><line x1="38" y1="56" x2="90" y2="56" stroke="#FFF" stroke-width="4"/><line x1="38" y1="74" x2="75" y2="74" stroke="#FFF" stroke-width="4"/><line x1="38" y1="92" x2="85" y2="92" stroke="#E5484D" stroke-width="4"/></svg>
  </g>

  <!-- Title -->
  <text x="28" y="92" fill="#F5F5F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5">Append-Only Event Log</text>

  <!-- Accent line -->
  <rect x="28" y="112" width="48" height="2.5" rx="1" fill="#E5484D" />

  <!-- Description -->
  <foreignObject x="28" y="126" width="384" height="96">
    <div xmlns="http://www.w3.org/1999/xhtml" style="color: rgba(255,255,255,0.72); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13.5px; line-height: 1.55; margin: 0; padding: 0;">
      Write-ahead SQLite WAL persistence (44,730 writes/sec) committed to disk prior to in-memory state mutation.
    </div>
  </foreignObject>

  <!-- Verification Pill -->
  <g transform="translate(28, 218)">
    <circle cx="5" cy="5" r="3.5" fill="#58E3A8" />
    <text x="16" y="8.5" fill="rgba(255,255,255,0.5)" font-family="ui-monospace, monospace" font-size="10" letter-spacing="0.5">SHIPPED · APPLIED IN PROJECTS</text>
  </g>
</svg>